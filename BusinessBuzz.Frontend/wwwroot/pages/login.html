<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Log In | Business Buzz</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Business Buzz CSS -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body class="auth-body">

    <main class="auth-page">

        <!-- Business Buzz Logo -->
        <a href="/index.html" class="auth-logo">
            Business Buzz
        </a>

        <div class="auth-heading">

            <h1>Welcome back</h1>

            <p>
                Log in to continue your journey.
            </p>

        </div>


        <!-- Login Card -->
        <div class="auth-card">

            <form id="loginForm">

                <!-- Email -->
                <div class="mb-3">

                    <label for="email"
                           class="form-label">
                        Email Address
                    </label>

                    <input type="email"
                           class="form-control"
                           id="email"
                           name="email"
                           placeholder="noni@example.co.za"
                           required>

                </div>


                <!-- Password -->
                <div class="mb-3">

                    <label for="password"
                           class="form-label">
                        Password
                    </label>

                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password"
                           placeholder="Enter your password"
                           required>

                </div>


                <!-- Login -->
                <button type="submit"
                        class="btn auth-primary-btn w-100">
                    Log In
                </button>

            </form>


            <!-- Forgot Password -->
            <p class="text-center mt-3 mb-0">

                <a href="#"
                   class="forgot-password">
                    Forgot Password?
                </a>

            </p>


            <div class="auth-divider"></div>


            <p class="auth-switch">
                Don't have an account?

                <a href="/pages/signup.html">
                    Create Account
                </a>
            </p>

        </div>


        <p class="auth-terms">
            By continuing, you agree to our Terms of Service and Privacy Policy.
        </p>

    </main>


    <script src="/js/login.js"></script>

</body>

</html>
